name: Object-aware editing tests
on:
  push:
    branches: [feature/object-aware-shape-editing]
  pull_request:
    paths:
      - 'geometry-edit.js'
      - 'geometry-mask.mjs'
      - 'geometry-edit.css'
      - 'lib/image-provider.js'
      - 'premium.js'
      - 'app.js'
      - 'project-file.js'
      - 'tests/geometry-*'
      - 'package.json'
      - '.github/workflows/geometry-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --check geometry-edit.js
      - run: node --check premium.js
      - run: node --check lib/image-provider.js
