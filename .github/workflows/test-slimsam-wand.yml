name: Test AI Masking UX
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'slimsam-*'
      - 'auto-regions.js'
      - 'regions.js'
      - 'mask-progress.js'
      - 'mask-cleanup.mjs'
      - 'tests/slimsam-wand.test.mjs'
      - 'package.json'
      - 'local-server.js'
      - 'scripts/dev-server.js'
      - 'tests/local-assets.test.cjs'
      - '.github/workflows/test-slimsam-wand.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'slimsam-*'
      - 'auto-regions.js'
      - 'regions.js'
      - 'mask-progress.js'
      - 'mask-cleanup.mjs'
      - 'tests/slimsam-wand.test.mjs'
      - 'package.json'
      - 'local-server.js'
      - 'scripts/dev-server.js'
      - 'tests/local-assets.test.cjs'
      - '.github/workflows/test-slimsam-wand.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SlimSAM source syntax
        run: |
          node --check slimsam-worker.mjs
          node --check slimsam-mask-utils.mjs
          node --check mask-cleanup.mjs
          node --check slimsam-wand.js
          node --check app.js
          node --check auto-regions.js
          node --check regions.js
          node --check mask-progress.js
      - name: Run mask, region, and local-server asset tests
        run: node --test tests/slimsam-wand.test.mjs tests/local-assets.test.cjs
      - name: Check frontend references and Color removal
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('app.js','utf8');
          if(!html.includes('./slimsam-wand.js')) throw Error('Wand controller not loaded');
          if(!html.includes('id="slimsamWandStatus"')) throw Error('SlimSAM UI state missing');
          if(html.includes('id="wandTolerance"') || html.includes('id="wandEngine"')) throw Error('Obsolete Color Wand UI');
          if(app.includes('applyMagicWand(')) throw Error('Obsolete Color Wand processor');
          if(!app.includes('applyWandMask(')) throw Error('SlimSAM does not commit masks to editor');
          const auto = fs.readFileSync('auto-regions.js','utf8');
          const regions = fs.readFileSync('regions.js','utf8');
          const css = fs.readFileSync('styles.css','utf8');
          if(!auto.includes('core.newGroup(fullMask)') || !auto.includes('core.matchingGroup(fullMask')) throw Error('SAM3 must create/reuse Groups immediately');
          if(!auto.includes('MosaicMaskProgress?.show')) throw Error('SAM3 progress HUD missing');
          if(!app.includes('selectionOverlayHidden') || !regions.includes('state.selectionOverlayHidden')) throw Error('Sidebar selection hide contract missing');
          if(!app.includes('appendGroupSelection(group)')) throw Error('Ctrl multi-select missing');
          if(!app.includes('group-cutout') || !app.includes('option-cutout')) throw Error('Transparent thumbnails missing');
          if(!css.includes('.mask-progress-hud') || !html.includes('./mask-progress.js')) throw Error('Progress HUD not loaded');
          if(!app.includes("tc.filter='blur(1.8px)'")) throw Error('Cutout-only feather missing');
          const worker=fs.readFileSync('slimsam-worker.mjs','utf8');
          const wand=fs.readFileSync('slimsam-wand.js','utf8');
          const hud=fs.readFileSync('mask-progress.js','utf8');
          if(!worker.includes('hf.env.useBrowserCache = true')) throw Error('Wand weights not cached in browser');
          if(!wand.includes('preload();')) throw Error('Wand model not prefetched on app startup');
          if(!hud.includes('document.body.append(hud)')) throw Error('Progress must stay visible before canvas loads');
          if(!css.includes('mask-soft-shimmer') || !css.includes('mask-ants-march')) throw Error('Subtle animations missing');
          if(!app.includes('is-quiet')) throw Error('Sidebar must use quiet outlines');
          if(html.includes('AI · Tiny')) throw Error('Old AI Tiny label still visible');
          if(!auto.includes('cleanAutoMask') || !auto.includes('core.newGroup(fullMask)')) throw Error('Clean Group creation missing');
          if(auto.includes('core.assignGroup(')) throw Error('Auto Create must not add Options');

          NODE
