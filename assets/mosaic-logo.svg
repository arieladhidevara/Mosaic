<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mosaic</title>
  <desc id="desc">Five gradient diamonds on a purple, navy and green rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d0fcf"/>
      <stop offset="0.42" stop-color="#11112d"/>
      <stop offset="0.72" stop-color="#041b27"/>
      <stop offset="1" stop-color="#006d45"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0.12" cy="0.07" r="0.72">
      <stop offset="0" stop-color="#9f00ff" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#5f00b8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5f00b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.92" cy="0.88" r="0.72">
      <stop offset="0" stop-color="#00db6f" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#00a95c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00a95c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpleDiamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ae24ff"/>
      <stop offset="0.55" stop-color="#952bff"/>
      <stop offset="1" stop-color="#6d68ef"/>
    </linearGradient>
    <linearGradient id="blendDiamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ae24ff"/>
      <stop offset="0.48" stop-color="#7875e8"/>
      <stop offset="1" stop-color="#42d7b1"/>
    </linearGradient>
    <linearGradient id="greenDiamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef2a0"/>
      <stop offset="0.55" stop-color="#40e99d"/>
      <stop offset="1" stop-color="#24ee83"/>
    </linearGradient>
    <filter id="diamondShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#040817" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="508" height="508" rx="104" fill="url(#background)"/>
  <rect x="2" y="2" width="508" height="508" rx="104" fill="url(#purpleGlow)"/>
  <rect x="2" y="2" width="508" height="508" rx="104" fill="url(#greenGlow)"/>
  <g fill="#fff" filter="url(#diamondShadow)">
    <path d="M191 136 248 207 191 278 134 207Z"/>
    <path d="M321 136 378 207 321 278 264 207Z"/>
    <path d="M126 218 184 291 126 364 68 291Z"/>
    <path d="M256 218 314 291 256 364 198 291Z"/>
    <path d="M386 218 444 291 386 364 328 291Z"/>
  </g>
</svg>
