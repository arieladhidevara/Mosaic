<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>mozAI Admin</title><link rel="icon" href="/assets/mosaic-logo.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/admin-benchmark.css"></head>
<body class="account-pending"><section id="accountGate" class="account-gate" aria-label="Account access"><p>Opening mozAI...</p></section>
<div id="adminApp"><header class="admin-header"><a href="/" class="admin-brand">mozAI <span>Admin</span></a><div id="adminAccount"></div></header>
<div class="admin-workspace"><nav id="adminNav" aria-label="Admin sections"><a class="btn btn-outline" href="/">Open editor</a><button data-view="overview" class="active">Overview</button><button data-view="users">Users</button><button data-view="invitations">Invitations</button><button data-view="generations">BYOK usage</button><button data-view="benchmark">Object ID Lab</button><button data-view="events">Activity</button></nav>

<div id="adminPages" hidden><button id="adminPrevious" class="btn btn-outline">Previous</button><span id="adminPage"></span><button id="adminNext" class="btn btn-outline">Next</button></div>
<section id="localDataControls" hidden><h2>Local test data</h2><p>Reset development activity, projects, invitations and generation records. The editor and saved .moz files are preserved.</p><button id="resetLocalData" class="btn btn-outline">Reset local test data</button></section>
</main></div></div><script type="module" src="/account.js"></script><script type="module" src="/admin-benchmark.js"></script><script type="module" src="/admin.js"></script></body></html>
